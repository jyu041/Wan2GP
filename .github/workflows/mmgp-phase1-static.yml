name: MMGP experimental static checks

on:
  push:
    branches:
      - exp/mmgp-phase1-profiler
      - exp/mmgp-phase2a-async45
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile instrumentation sources
        run: python -m py_compile shared/utils/mmgp_profiler.py wgp.py
      - name: Verify MMGP experimental integration anchors
        run: python scripts/test_mmgp_phase1_static.py
